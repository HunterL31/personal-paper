name: docker

# Builds the Molly Ledger image and publishes it to Docker Hub as
# <DOCKERHUB_USERNAME>/molly-ledger so the Unraid box never builds anything.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  Docker Hub account name (also used as the image namespace)
#   DOCKERHUB_TOKEN     Docker Hub access token, NOT the account password

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/molly-ledger
          tags: |
            # latest only for pushes to the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 -> 1.2.3 and 1.2
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # every build also gets sha-<short>
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # The base image (mcr.microsoft.com/playwright/python:v1.56.0-noble)
          # is amd64-only in practice, so we build amd64 alone. To also build
          # arm64, add QEMU above (docker/setup-qemu-action@v4) and change the
          # line below to:
          #   platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
